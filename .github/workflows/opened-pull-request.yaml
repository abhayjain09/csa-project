name: opened pull request comment

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened]
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  opened-pull-request:
    runs-on: dts-pod-runner-rhel9
    steps:
      - uses: actions/checkout@v4
      - name: comment
        if: ${{ !contains(github.actor, 'bot') && !contains(github.actor, '[bot]') }}
        uses: spglobal-innersource/comment-action@v0.3.0
        with:
          file: .github/new-pr-comment.md
      - name: comment-bot
        if: ${{ contains(github.actor, 'bot') && contains(github.actor, '[bot]') }}
        uses: spglobal-innersource/comment-action@v0.3.0
        with:
          file: .github/new-pr-comment-bot.md