name: pull-request-lint

on:
  pull_request_target:
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  merge_group:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate PR title
    runs-on: dts-pod-runner-rhel9
    if: ${{ (!contains(github.actor, 'bot') && !contains(github.actor, '[bot]')) && (github.event_name == 'pull_request_target' || github.event_name == 'pull_request') }}
    steps:
      - uses: amannn/action-semantic-pull-request@v5.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |-
            feat
            fix
            breaking
            refactor
            test
            chore
            docs
          requireScope: false
          validateSingleCommit: false